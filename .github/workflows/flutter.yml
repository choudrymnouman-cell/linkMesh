name: Flutter CI
on:
  push:
    branches: [main, flutter-recreation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed release APKs by CPU architecture
        run: flutter build apk --release --split-per-abi
      - name: Upload installable release APKs
        uses: actions/upload-artifact@v4
        with:
          name: linkmesh-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
