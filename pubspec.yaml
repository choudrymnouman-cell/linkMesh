name: linkmesh_offline_chat
description: Flutter recreation of the supplied offline mesh chatting APK.
publish_to: 'none'
version: 2.5.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  sqflite: ^2.4.2
  path: ^1.9.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  record: ^6.1.2
  open_filex: ^4.6.0
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
